name: BedRock-FastApi - Deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - stg
          - prd
      image_tag:
        description: "image tag to deploy (Optional)"
        required: false
      

jobs:
  call-deploy:
    name: Workflow
    uses: TaxMD/taxmd-artifacts/.github/workflows/deploy-v1.yaml@main
    with:
      image_tag: ${{ inputs.image_tag }}
      env: ${{ inputs.env }}
      repo_name: ${{ github.repository }}
      env_file_name: "app.env"
    secrets:
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
    permissions:
      id-token: write
      contents: read
